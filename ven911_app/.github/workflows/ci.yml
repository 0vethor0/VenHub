name: CI Pipeline - Flutter Build & Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ven911_app
          flutter pub get

      - name: Analyze code
        run: |
          cd ven911_app
          flutter analyze

      - name: Run unit tests
        run: |
          cd ven911_app
          flutter test --no-pub
