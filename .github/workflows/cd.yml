name: CD Pipeline - Release APK & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Release Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd ven911_app
          flutter pub get

      - name: Build APK Release
        run: |
          cd ven911_app
          flutter build apk --release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ven911_app/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ env.VERSION }}
          body: |
            Release automático de VEN911 Levantamiento de Campo (${{ env.VERSION }}).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register Release in Supabase app_releases Table
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/app-release.apk"
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/app_releases" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${{ env.VERSION }}\", \"url_apk\": \"${APK_URL}\", \"notas_lanzamiento\": \"Publicación automatizada mediante GitHub Actions tag ${{ env.VERSION }}\"}"
